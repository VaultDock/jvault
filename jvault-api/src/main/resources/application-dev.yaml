# A single-machine development profile. Every value here is either a convenience that a real
# deployment must replace, or a default that happens to be right everywhere.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/jvault
    username: jvault
    password: jvault

jvault:
  tenant: dev
  # The origin links point at, which is where a person opens them — the SPA. Its dev server
  # proxies /c and /api through to this service, so a content link still reaches the API. In a
  # deployment both sit behind one host and this is simply that host.
  base-url: http://localhost:5173
  jira:
    deployment-id: jira-cloud-dev
    # Supplied from the environment: JVAULT_JIRA_BASEURL, JVAULT_JIRA_EMAIL,
    # JVAULT_JIRA_APITOKEN. A token in a file is a token in a commit.
    base-url: ${JVAULT_JIRA_BASEURL:}
    email: ${JVAULT_JIRA_EMAIL:}
    api-token: ${JVAULT_JIRA_APITOKEN:}
  storage:
    route: fs-local
    root: /tmp/jvault-dev/content
  crypto:
    # Derives the development keys so that a restart can still read what the last run wrote.
    # Without it every restart makes every stored token and document unreadable, which looks
    # like a dozen unrelated failures rather than one expected consequence.
    dev-passphrase: ${JVAULT_DEV_PASSPHRASE:jvault-development-only}
    key-rings:
      - default
      - sec-restricted
  # One rule: descriptions in KAN leave Jira. Everything else this profile touches stays where
  # it was, which is what makes the difference visible when a ticket is created.
  policies:
    - id: dev-description-external
      deployment: jira-cloud-dev
      project: KAN
      part-type: DESCRIPTION
      placement: EXTERNAL
      classification: RESTRICTED
      storage-route: fs-local
      key-ring: sec-restricted
      surrogate: "=== SECURED ===\nThis field is held in jvault and is not in Jira.\nRead it at {{ticketLink}}"
      links: [REMOTE_LINK]

    # Documents never go to Jira in this profile. Attachments are the reason most of the storage
    # machinery exists, so a development setup that left them in Jira would exercise none of it.
    - id: dev-attachments-external
      deployment: jira-cloud-dev
      project: KAN
      part-type: ATTACHMENT
      placement: EXTERNAL
      classification: CONFIDENTIAL
      storage-route: fs-local
      key-ring: sec-restricted
      surrogate: "=== SECURED ===\nDocument held in jvault: {{ticketLink}}"
      links: [REMOTE_LINK]

  # Signing in with Atlassian. Create an OAuth 2.0 (3LO) app at developer.atlassian.com, add the
  # Jira API with the read:jira-work, read:jira-user and offline_access scopes, and register the
  # callback below as the redirect URL. The secret comes from the environment; a secret in a file
  # is a secret in a commit.
  oauth:
    enabled: ${JVAULT_OAUTH_ENABLED:false}
    client-id: ${JVAULT_OAUTH_CLIENTID:}
    client-secret: ${JVAULT_OAUTH_CLIENTSECRET:}
    redirect-uri: http://localhost:8080/api/v1/auth/callback
    app-base-url: http://localhost:5173
    # Plain http on localhost only. Anywhere a browser reaches this over TLS, this is true.
    secure-cookies: false
    # The fallback for a deployment that cannot reach auth.atlassian.com. An explicit admin
    # decision, because it gives up per-scope limitation, revocation by the user, and clean
    # attribution (docs/10-authentication.md 10.6).
    allow-manual-token: ${JVAULT_ALLOW_MANUAL_TOKEN:false}

  dev:
    # Identity from a request header. Named so that nobody enables it by accident, and the
    # application says so in its startup log every time.
    insecure-auth: true
    default-user: dev-user
    bootstrap-project: KAN
    # Signing in with Atlassian makes your account id the principal, and a fresh identity has no
    # grants. Named here rather than granted on sign-in: "whoever authenticates gets rights" is
    # not a development convenience, it is the absence of authorization.
    bootstrap-principals:
      - "712020:8e1dc606-e005-43bf-8d1b-0e02b229731b"
