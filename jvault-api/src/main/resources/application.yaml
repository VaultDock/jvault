spring:
  application:
    name: jvault-api
  flyway:
    # SchemaMigrator runs the migrations, not Boot's auto-configuration. The scripts live in one
    # directory per engine, and the engine is not known until the connection is open — Boot's
    # default scan of classpath:db/migration finds all three at once and refuses, having found
    # three different V1s.
    enabled: false
  mvc:
    problemdetails:
      # RFC 9457 for framework-raised errors too, so a 405 and a validation failure have the same
      # shape as everything else a client has to parse.
      enabled: true
  servlet:
    multipart:
      # Slightly above jvault.storage.max-upload-bytes on purpose. This limit is enforced by the
      # container, which answers with its own error before any jvault code runs; leaving a little
      # headroom means an oversized file gets the endpoint's own message saying what the limit is,
      # rather than a bare 500 from Tomcat.
      max-file-size: 110MB
      max-request-size: 120MB

server:
  error:
    # Never render a stack trace or a default error page: both are places where a message
    # containing content could surface.
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

jvault:
  jira:
    connect-url: /api/v1/jira/connections/start
